<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia&effect=fire|neon|outline|emboss|shadow-multiple">

  <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      Task Planner📝
    </a>

    <div class="d-flex align-items-center gap-3 text-white">

      <!-- USER INFO -->
      <div class="d-flex align-items-center gap-2">

        <i class="bi bi-person-circle fs-3"role="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#profileCanvas">
        </i>
        <div>

          <div id="userName" class="fw-semibold small">
            User Name
          </div>

          <div id="userEmail" class="small">
            user@gmail.com
          </div>

        </div>

      </div>

      <button class="btn btn-light btn-sm" id="themeToggle">
          <i class="bi bi-moon-fill"></i>
          Dark Mode
      </button>

      <!-- LOGOUT -->
      <button class="btn btn-light btn-sm" id="logoutBtn">
        Logout
      </button>

    </div>

  </div>

</nav>

  <!-- DASHBOARD -->
  <div class="container py-5">


    <!-- TOP -->
    <div class="d-flex justify-content-between align-items-center mb-4">

      <h2 class="fw-bold">
        My Tasks
      </h2>

      <button class="btn btn-primary" id="showTaskBox">
        <i class="bi bi-plus-circle-fill me-2"></i>Add Task
      </button>

    </div>

    <!-- SECTION FILTER -->
    <div class="mb-4 d-flex gap-2 flex-wrap">

      <button class="btn btn-dark sectionFilterBtn" data-section="All">
       <i class="bi bi-grid-fill me-2"></i>  All Tasks
      </button>

      <button class="btn btn-primary sectionFilterBtn" data-section="Active">
         Not Started
      </button>

      <button class="btn btn-success sectionFilterBtn" data-section="Completed">
       <i class="bi bi-check-circle-fill me-2"></i> Completed
      </button>

      <button class="btn btn-warning sectionFilterBtn" data-section="Overdue">
       <i class="bi bi-exclamation-triangle-fill me-2"></i> Overdue
      </button>

      <button class="btn btn-secondary sectionFilterBtn" data-section="Deleted">
       <i class="bi bi-trash-fill me-2"></i> Deleted
      </button>

    </div>


    <!-- ADD TASK FORM -->
    <div class="card shadow-sm p-4 mb-4 d-none" id="taskBox">

      <div class="mb-3">
        <label class="form-label">
          Task Title
        </label>

        <input type="text" class="form-control" id="taskTitle">
      </div>


      <div class="mb-3">
        <label class="form-label">
          Task Description
        </label>

        <textarea class="form-control" rows="3" id="taskDescription"></textarea>
      </div>


      <div class="mb-3">

        <label class="form-label">
          Priority
        </label>

        <select class="form-select" id="taskPriority">

          <option value="Low">
            Low
          </option>

          <option value="Medium">
            Medium
          </option>

          <option value="High">
            High
          </option>

        </select>

      </div>


      <div class="row">

        <div class="col-md-6 mb-3">

          <label class="form-label">
            Task Time
          </label>

          <input type="time" class="form-control" id="taskTime">

        </div>


        <div class="col-md-6 mb-3">

          <label class="form-label">
            Due Date
          </label>

          <input type="date" class="form-control" id="taskDate">

        </div>

      </div>


      <button class="btn btn-success" id="addTaskBtn">
        Add Task
      </button>

    </div>


    <!-- ACTIVE -->
    <div id="activeSection">

      <h3 class="section-title text-primary">
        Tasks
      </h3>

      <div id="taskList" class="row g-4"></div>

    </div>


    <!-- COMPLETED -->
    <div id="completedSection" class="d-none">

      <h3 class="section-title text-success">
        Completed Tasks
      </h3>

      <div id="completedTaskList" class="row g-4"></div>

    </div>


    <!-- OVERDUE -->
    <div id="overdueSection" class="d-none">

      <h3 class="section-title text-warning">
        Overdue Tasks
      </h3>

      <div id="overdueTaskList" class="row g-4"></div>

    </div>


    <!-- DELETED -->
    <div id="deletedSection" class="d-none">

      <h3 class="section-title text-secondary">
        Deleted Tasks
      </h3>

      <div id="deletedTaskList" class="row g-4"></div>

    </div>

  </div>

  <!-- USER PROFILE OFFCANVAS -->

  <div class="offcanvas offcanvas-end"
      tabindex="-1"
      id="profileCanvas">

    <div class="offcanvas-header">

      <h5 class="offcanvas-title">
        My Profile
      </h5>

      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="offcanvas">
      </button>

    </div>

    <div class="offcanvas-body">

      
      <table class="table">

        <tbody>

          <tr>
            <th>Name</th>
            <td id="profileName"></td>
          </tr>

          <tr>
            <th>Email</th>
            <td id="profileEmail"></td>
          </tr>

          <tr>
            <th>Phone</th>
            <td id="profilePhone"></td>
          </tr>

          <tr>
            <th>Age</th>
            <td id="profileAge"></td>
          </tr>

          <tr>
            <th>DOB</th>
            <td id="profileDOB"></td>
          </tr>

          <tr>
            <th>Country</th>
            <td id="profileCountry"></td>
          </tr>

          <tr>
            <th>Gender</th>
            <td id="profileGender"></td>
          </tr>

          <tr>
            <th>Skills</th>
            <td id="profileSkills"></td>
          </tr>

          <tr>
            <th>Address</th>
            <td id="profileAddress"></td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>



  <!-- BOOTSTRAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="../js/configure.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/user.js"></script>
  <script src="../js/task.js"></script>
  <script src="../js/dashboard.js"></script>

</body>
</html>
